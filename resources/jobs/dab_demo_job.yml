resources:
  jobs:
    dab_demo_job:
      name: dab_demo_job
      tasks:
        - task_key: demo_notebook
          notebook_task:
            notebook_path: ../Notebooks/demo_repo_notebook.py
            source: WORKSPACE
          environment_key: Default
      queue:
        enabled: true
      environments:
        - environment_key: Default
          spec:
            environment_version: "6"
      performance_target: PERFORMANCE_OPTIMIZED